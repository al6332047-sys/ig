<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Xenox AI</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      html,
      body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #080b12;
        color: white;
      }
      .app {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 900px;
        margin: auto;
        background: #0d111a;
        position: relative;
      }

      /* القائمة الجانبية للشاتات القديمة */
      .sidebar {
        position: absolute;
        top: 0;
        right: -280px;
        width: 280px;
        height: 100%;
        background: #111722;
        z-index: 100;
        transition: 0.3s;
        border-left: 1px solid #222938;
        padding: 20px;
      }
      .sidebar.active {
        right: 0;
      }
      .sidebar h3 {
        margin-bottom: 15px;
        font-size: 16px;
      }
      .history-list {
        list-style: none;
      }
      .history-item {
        padding: 10px;
        background: #1b2230;
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 14px;
      }
      .history-item:hover {
        background: #222a38;
      }

      /* الهيدر وشعار Xenox */
      header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid #222938;
        background: #111722;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .xenox-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
      }
      .title {
        font-size: 18px;
        font-weight: bold;
      }
      .header-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn-icon {
        background: #202736;
        border: 1px solid #30394c;
        color: white;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      .btn-icon:hover {
        background: #2a3346;
      }

      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }
      .message {
        max-width: 85%;
        padding: 13px 16px;
        border-radius: 18px;
        margin-bottom: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .bot {
        background: #171d29;
        border-bottom-right-radius: 5px;
        margin-left: auto;
      }
      .user {
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        border-bottom-left-radius: 5px;
        margin-right: auto;
      }

      /* الجزء السفلي وضبط الكيبورد للموبايل */
      .bottom {
        position: sticky;
        bottom: 0;
        padding: 12px;
        border-top: 1px solid #222938;
        background: #111722;
        z-index: 10;
      }
      .inputBox {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      textarea {
        flex: 1;
        resize: none;
        height: 48px;
        background: #080c14;
        color: white;
        border: 1px solid #30394a;
        border-radius: 16px;
        padding: 14px;
        outline: none;
        font-size: 15px;
      }
      .send {
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 15px;
        background: #00c6ff;
        color: white;
        cursor: pointer;
        font-size: 19px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- القائمة الجانبية -->
      <div class="sidebar" id="sidebar">
        <h3>المحادثات السابقة</h3>
        <ul class="history-list">
          <li class="history-item">🤖 محادثة تطوير تطبيق</li>
          <li class="history-item">💻 كتابة كود Python</li>
          <li class="history-item">🖼️ إنشاء صورة رقمية</li>
        </ul>
      </div>

      <header>
        <div class="logo">
          <div class="xenox-icon">🤖</div>
          <div>
            <div class="title">Xenox</div>
            <div style="font-size: 11px; color: #65e6a7">● متصل الآن</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-icon" onclick="startCall()">📞</button>
          <button class="btn-icon" onclick="loginGoogle()">
            🔑 تسجيل Google
          </button>
          <button class="btn-icon" onclick="toggleSidebar()">☰</button>
        </div>
      </header>

      <div class="chat" id="chat">
        <div class="message bot">
          Welcome to Xenox AI 🤖 أهلاً بك! أنا مساعدك الذكي Xenox. اكتب لي
          باللغة العربية أو الإنجليزية وسأجيبك بنفس اللغة تلقائياً.
        </div>
      </div>

      <div class="bottom">
        <div class="inputBox">
          <textarea
            id="input"
            placeholder="اكتب رسالتك أو الكود..."
            onkeydown="handleKey(event)"
          ></textarea>
          <button class="send" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>

    <script>
      // سيتم جلب المفتاح تلقائياً من إعدادات البيئة (Environment Variables) بعد الرفع
      const GEMINI_API_KEY = "";

      let history = [];

      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
      }

      function loginGoogle() {
        alert("جاري إعادة التوجيه لخدمة Google Auth...");
      }

      function startCall() {
        alert("بدء الاتصال الصوتي المباشر مع Xenox...");
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      async function askGemini(text) {
        const isEnglish = /[a-zA-Z]/.test(text);
        const systemPrompt = isEnglish
          ? "You are Xenox AI. The user is writing to you in English. You MUST reply ONLY in English. Provide clean, structured code or answers."
          : "أنت Xenox AI، مساعد ذكي. المستخدم يكتب لك بالعربية، يجب أن تجيب باللغة العربية فقط. قدم أكواداً وإجابات منظمة وكاملة.";

        history.push({
          role: "user",
          parts: [{ text: text }],
        });

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-goog-api-key": GEMINI_API_KEY,
              },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: history,
              }),
            }
          );

          if (!response.ok) throw new Error("API Key Missing or Invalid");

          const data = await response.json();
          const answer =
            data?.candidates?.[0]?.content?.parts
              ?.map((p) => p.text || "")
              .join("") || "لم يتم استلام رد.";

          history.push({
            role: "model",
            parts: [{ text: answer }],
          });

          return answer;
        } catch (error) {
          throw error;
        }
      }

      async function sendMessage() {
        const input = document.getElementById("input");
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        const loading = addMessage("جاري التفكير...", "bot");

        try {
          const answer = await askGemini(text);
          loading.remove();
          addMessage(answer, "bot");
        } catch (error) {
          loading.remove();
          addMessage(
            "يرجى ربط المفتاح في إعدادات المنصة المرفوع عليها التطبيق.",
            "bot"
          );
        }
      }

      function addMessage(text, type) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "message " + type;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }
    </script>
  </body>
</html>
